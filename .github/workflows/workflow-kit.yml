name: Workflow Kit

on:
  pull_request:
    paths:
      - "workflow-kit/**"
      - "tests/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - "README.md"
      - "_project/backlog-policy.md"
      - ".github/workflows/workflow-kit.yml"
  push:
    branches: [main]
    paths:
      - "workflow-kit/**"
      - "tests/**"
      - "pyproject.toml"
      - "AGENTS.md"
      - "README.md"
      - "_project/backlog-policy.md"
      - ".github/workflows/workflow-kit.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate contract and manifest
        run: python workflow-kit/runtime.py --offline

      - name: Validate schema and runtime syntax
        run: |
          python -m json.tool workflow-kit/manifest.schema.json >/dev/null
          python -m py_compile workflow-kit/*.py

      - name: Run complete current-workflow suite
        run: python -m pytest tests/

      - name: Lint changed runtime surfaces
        run: >-
          ruff check
          workflow-kit/*.py
          tests/workflow-kit
